[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypgfplots"
version = "0.1.9"
description = "Minimal pgfplots wrapper for marimo notebooks"
license = { text = "MIT" }
requires-python = ">=3.10"
readme = "README.md"
authors = [
  { name = "Björn Rüffer", email = "484548+bjoseru@users.noreply.github.com" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
  "Intended Audience :: Science/Research",
]

[project.urls]
Repository = "https://github.com/bjoseru/pypgfplots"

[tool.hatch.build.targets.wheel]
packages = ["pypgfplots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
